name: Prepare v0.6 documentation assets
on:
  push:
    branches: [docs/v06-screenshots-wiki]
    paths: ['.github/workflows/docs-refresh-assets.yml']
permissions:
  contents: write
  actions: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v06-screenshots-wiki
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pillow
      - name: Retrieve actual screenshots from the successful v0.6 release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p test-results/docs-refresh
          gh api repos/AronAxe/GraphPaper/actions/runs/37807775156 > test-results/docs-refresh/release-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('test-results/docs-refresh/release-run.json').read_text())
          assert run['head_sha']=='00cab75a2cfc13f541573be3bce14f0cc5b97684'
          assert run['conclusion']=='success'
          PY
          gh run download 37807775156 --repo AronAxe/GraphPaper --name graph-studio-browser-validation --dir test-results/docs-refresh/captures
      - name: Convert genuine screenshots without retouching the interface
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,hashlib
          source=Path('test-results/docs-refresh/captures');target=Path('docs/images')
          reports=list(source.rglob('report.json'))
          assert len(reports)==7
          for report in reports:
              assert json.loads(report.read_text()).get('ok') is True,report
          images={
              'graph-studio-v0.6.webp':'graph-studio/graph-studio.png',
              'dense-graph-v0.6.webp':'graph-studio/dense-overview.png',
              'graph-v0.6.webp':'ui/graph.png',
              'writing-v0.6.webp':'ui/writing.png',
              'angles-v0.6.webp':'ui/angles.png',
              'light-v0.6.webp':'ui/light.png',
              'welcome-v0.6.webp':'ui/welcome.png',
              'research-v0.6.webp':'science-ui/research.png',
              'apa-preview-v0.6.webp':'science-ui/apa-preview.png',
              'evidence-v0.6.webp':'science-ui/evidence.png',
              'reasoning-v0.6.webp':'science-ui/reasoning.png',
              'codex-v0.6.webp':'studio/codex.png',
              'folder-v0.6.webp':'studio/folder.png',
              'humanizer-v0.6.webp':'studio/humanizer.png',
              'voice-v0.6.webp':'studio/voice.png',
              'reusable-voice-v0.6.webp':'voices-ui/reusable-voice.png',
              'polemic-v0.6.webp':'polemic-ui/polemic-angles.png',
              'four-modes-v0.6.webp':'polemic-ui/four-modes.png',
              'graphify-graph-v0.6.webp':'graphify-ui/graphify-graph.png',
              'graphify-settings-v0.6.webp':'graphify-ui/graphify-settings.png'
          }
          manifest={'version':'0.6.0','source_revision':'00cab75a2cfc13f541573be3bce14f0cc5b97684','validation_run':'https://github.com/AronAxe/GraphPaper/actions/runs/37807775156','artifact_id':11563921375,'capture_kind':'Actual Chromium interface served by the application over loopback HTTP on a GitHub-hosted runner','material':'Included illustrative project and clearly synthetic test fixtures; no private manuscripts or accounts','processing':'WebP format conversion only; no retouching, image generation or compositing','images':{}}
          for name,path in images.items():
              original=source/path
              with Image.open(original) as image:
                  image.convert('RGB').save(target/name,format='WEBP',quality=91,method=6)
                  manifest['images'][name]={'capture':path,'width':image.width,'height':image.height,'original_sha256':hashlib.sha256(original.read_bytes()).hexdigest(),'webp_sha256':hashlib.sha256((target/name).read_bytes()).hexdigest()}
          (target/'screenshots-v0.6.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('Converted',len(images),'actual release screenshots; header artwork untouched.')
          PY
      - name: Commit only the screenshot assets to the documentation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/*v0.6*
          git diff --cached --check
          git commit -m 'Add provenance-linked screenshots from the actual v0.6 interface'
          git push origin HEAD:docs/v06-screenshots-wiki
      - name: Export reviewable source and current wiki without modifying the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip HEAD -o test-results/docs-refresh/repository.zip
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' clone --depth 1 https://github.com/AronAxe/GraphPaper.wiki.git /tmp/graphpaper-wiki-readonly
          git -C /tmp/graphpaper-wiki-readonly log -1 --format='%H %s'
          git -C /tmp/graphpaper-wiki-readonly archive --format=zip HEAD -o "$GITHUB_WORKSPACE/test-results/docs-refresh/wiki.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-review-bundle
          path: |
            test-results/docs-refresh/repository.zip
            test-results/docs-refresh/wiki.zip
            test-results/docs-refresh/release-run.json
          retention-days: 7
