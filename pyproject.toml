[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphpaper-studio"
version = "0.7.1"
description = "A local-first graph-guided writing studio for nonfiction and fiction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Aron Bijl"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["graphpaper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.data-files]
"share/graphpaper/ui" = ["ui/index.html", "ui/styles.css", "ui/app.js", "ui/studio.js", "ui/studio.css", "ui/science.js", "ui/science.css", "ui/graphify.js", "ui/polemic.js", "ui/polemic.css", "ui/voices.js", "ui/voices.css", "ui/icon.svg", "ui/graphpaper.ico", "ui/graph_math.js", "ui/graph_studio.js", "ui/graph_studio.css", "ui/system_one.js", "ui/system_one.css"]

"share/graphpaper/ui/assets" = ["ui/assets/graph-paper.webp", "ui/assets/graph-paper.json", "ui/assets/CREDITS.md"]

[project.optional-dependencies]
desktop = ["pywebview>=6.0,<7", "graphifyy[openai]==0.9.80"]
graphify = ["graphifyy[openai]==0.9.80"]

[project.gui-scripts]
graphpaper = "graphpaper.desktop:main"
