name: GraphPaper 0.5 hosted Windows release
on:
  push:
    branches: [main]
    paths: ['graphpaper/__init__.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graphpaper-0.5-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: test "$(python -c 'from graphpaper import __version__; print(__version__)')" = '0.5.0'
      - run: python -m pip install -q -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/linux.xml
      - run: python scripts/docs_tool.py check
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ui_smoke.py
      - run: python scripts/ui_studio_smoke.py
      - run: python scripts/ui_science_smoke.py
      - run: python scripts/ui_graphify_smoke.py
      - run: python scripts/ui_polemic_smoke.py
      - run: python scripts/ui_voices_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voices-linux-validation
          path: test-results/
  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/windows.xml
      - name: Build with public Graphify and official Codex
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_release.ps1
      - run: python scripts/native_smoke.py --science --graphify --polemic --voices --executable dist/GraphPaper/GraphPaper.exe --out test-results/native-package
      - uses: actions/upload-artifact@v4
        with:
          name: GraphPaper-v0.5.0-Windows-x64
          path: |
            dist/GraphPaper-v0.5.0-Windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish only the successfully tested artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.5.0'
          $package = 'GraphPaper-v0.5.0-Windows-x64.zip'
          $expected = ((Get-Content dist/SHA256SUMS.txt).Split(' ')[0]).Trim().ToLower()
          $actual = (Get-FileHash "dist/$package" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw 'Archive checksum mismatch.' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite it.' }
          gh release create $tag "dist/$package" dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'GraphPaper 0.5.0 - Reusable voice graphs' --notes-file docs/RELEASE-0.5.0.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq $package }
          if ($asset.digest -ne "sha256:$actual") { throw 'Uploaded artifact does not match the tested ZIP.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voices-windows-validation
          path: test-results/
