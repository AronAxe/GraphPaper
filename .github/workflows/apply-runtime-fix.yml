name: Apply verified Windows runtime repair
on:
  push:
    branches: [fix/windows-runtime-v0.7.1]
    paths: ['.github/workflows/apply-runtime-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-runtime-v0.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact tested patch without changing workflow permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/AronAxe/GraphPaper/git/blobs/076495d09cb43325e051fce5e120473353549af3 > /tmp/patch.json
          python - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path
          raw=json.loads(Path('/tmp/patch.json').read_text())
          patch=lzma.decompress(base64.b64decode(raw['content']))
          assert hashlib.sha256(patch).hexdigest()=='ac2909c57f3ca5a956a2986ae6caeb27da78ee1703834b577935d405c7b596ff'
          p=Path('/tmp/runtime.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--','.github/workflows']).strip()
          PY
      - run: python -m pip install -q -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/runtime-linux.xml
      - run: python -m unittest discover -s docs/tests -p 'test_*.py' -v
      - run: python scripts/docs_tool.py check
      - name: Commit ordinary source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          python scripts/prepare_assets.py --manifest
          git add publish-manifest.json
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git commit -m 'Repair Internet-marked bundled DLLs with explicit consent and per-build checksums'
          git push origin HEAD:fix/windows-runtime-v0.7.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-repair-linux-tests
          path: test-results/runtime-linux.xml
