<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
<title id="title">How GraphPaper works</title>
<desc id="description">Sources become a knowledge graph using Graphify, Native extraction or an imported graph. The graph supplies paths and motifs for angles. The author chooses an angle, edits the outline and writes a draft. The brief and a reusable voice graph guide writing. Science mode can add screened papers. Optional JEV evaluates candidates, fit, gaps and editorial decisions using compact, batched context. Review and optional Humanize or Deslop passes lead to author approval and export. Projects and writing history are saved locally.</desc>
