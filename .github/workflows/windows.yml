name: Build and publish Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ui_smoke.py
      - run: python scripts/ui_studio_smoke.py
      - run: python scripts/ui_science_smoke.py
      - run: python scripts/ui_graphify_smoke.py
      - run: python scripts/ui_polemic_smoke.py
      - run: python scripts/ui_voices_smoke.py
  windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/windows.xml
      - name: Build verified Windows package with official Codex runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_release.ps1
      - name: Exercise the actual Windows window, voices, native dialogs and save-on-close
        run: python scripts/native_smoke.py --science --graphify --polemic --voices --executable dist/GraphPaper/GraphPaper.exe --out test-results/native-package
      - uses: actions/upload-artifact@v4
        with:
          name: GraphPaper-Windows-x64
          path: |
            dist/GraphPaper-v*-Windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish a versioned release when built from a tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "from graphpaper import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match application version.' }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --verify-tag --title "GraphPaper $env:GITHUB_REF_NAME" --notes-file "docs/RELEASE-$version.md" }
          $packageName = "GraphPaper-v$version-Windows-x64.zip"
          $release = gh release view $env:GITHUB_REF_NAME --json assets | ConvertFrom-Json
          if ($release.assets.name -contains $packageName) {
            Write-Host 'A verified release package already exists; keeping it unchanged. This rebuild remains available as an Actions artifact.'
          } else {
            gh release upload $env:GITHUB_REF_NAME "dist/$packageName" dist/SHA256SUMS.txt
            if ($LASTEXITCODE -ne 0) { throw 'Release upload did not complete.' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: test-results/
