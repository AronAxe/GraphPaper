name: Publish and validate source import
on:
  push:
    branches: ['release/graphpaper-v0.1.0']
    paths: ['_transfer/**', '.github/workflows/import-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: graphpaper-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/graphpaper-v0.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble exact transferred frontend
        run: |
          if [ -f _transfer/assemble.py ]; then python _transfer/assemble.py; fi
          node --check ui/app.js
      - run: python -m pip install -q -r requirements-dev.txt 'pillow>=11,<13'
      - run: python scripts/prepare_assets.py
      - run: python -m pytest -q --junitxml=test-results/results.xml
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ui_smoke.py
      - run: python -m graphpaper.desktop --self-test test-results/loopback.json
      - name: Publish complete verified source and actual previews
        run: |
          python scripts/prepare_assets.py --reports
          git add -A -- ui docs examples scripts/ui_smoke.py
          if git ls-files _transfer/ | grep -q .; then git add -u -- _transfer; fi
          python scripts/prepare_assets.py --manifest
          git add publish-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified source assets and validation reports'
            git push origin HEAD:release/graphpaper-v0.1.0
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-import-validation
          path: test-results/
  windows:
    needs: import
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/graphpaper-v0.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/windows.xml
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - run: python scripts/check_package.py dist/GraphPaper
      - uses: actions/upload-artifact@v4
        with:
          name: GraphPaper-Windows-x64
          path: dist/GraphPaper-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: test-results/
