name: Apply verified v0.6 documentation
on:
  push:
    branches: [docs/v06-screenshots-wiki]
    paths: ['.github/workflows/docs-refresh-assets.yml']
permissions:
  contents: write
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v06-screenshots-wiki
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the checksum-verified documentation patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,subprocess
          parts=[Path('.github/docs-refresh-part'+str(i)+'.b64') for i in (1,2)]
          encoded=''.join(p.read_text().strip() for p in parts)
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='6574ef4e27c26da4cd56828b0b05c6035b3f9b16712778fb7c47d201445c8b3f','Patch checksum mismatch'
          target=Path('/tmp/docs-refresh.patch');target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          for p in parts:p.unlink()
          assert hashlib.sha256(Path('docs/images/graphpaper-header.svg').read_bytes()).hexdigest()=='80bfe7844f469ef2c3d63dd7ca2321d6c24ebed7f5c56555d797227e81a7955e'
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(p=='README.md' or p.startswith('docs/') or p.startswith('.github/docs-refresh-part') for p in changed),changed
          PY
      - name: Test version coverage, real screenshot provenance, links and wiki generation
        run: |
          python -m unittest discover -s tests -p test_documentation_tools.py -v
          python -m unittest discover -s docs/tests -p 'test_*.py' -v
          python scripts/docs_tool.py check
          python scripts/docs_tool.py render-wiki --output test-results/wiki-preview
      - name: Commit documentation only; leave workflow changes to the connector
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows graphpaper ui scripts tests)"
          python scripts/prepare_assets.py --manifest
          python - <<'PY'
          from pathlib import Path
          import json
          # The final connector commit replaces docs.yml and removes this one-off
          # workflow. Record that reviewed final tree without changing workflows here.
          path=Path('publish-manifest.json');manifest=json.loads(path.read_text())
          manifest['files'].pop('.github/workflows/docs-refresh-assets.yml',None)
          manifest['files']['.github/workflows/docs.yml']='839af4553785c5a2b04a2647791f4056ce7bdb97d20cb5e56bddd65e0d429c68'
          path.write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          git add publish-manifest.json
          git diff --cached --check
          git commit -m 'Refresh real v0.6 screenshots, complete 23 wiki guides and prevent stale documentation'
          git push origin HEAD:docs/v06-screenshots-wiki
          git show --stat --oneline HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-wiki-preview
          path: test-results/wiki-preview/
