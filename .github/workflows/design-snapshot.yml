name: Graph studio source snapshot
on:
  push:
    branches: ['feat/graph-studio-v0.6']
    paths: ['.github/workflows/design-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o /tmp/graphpaper-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: graphpaper-design-source
          path: /tmp/graphpaper-source.zip
          retention-days: 3
