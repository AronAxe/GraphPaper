name: Agent skills
on:
  push:
    paths:
      - 'skills/**'
      - '.github/workflows/agent-skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      - '.github/workflows/agent-skills.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skill-tests:
    name: Agent skill / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      GRAPHPAPER_REQUIRE_BACKEND_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install source and test dependencies, without desktop windowing
        run: python -m pip install -q -r requirements-dev.txt
      - name: Check the headless helper, skill contracts and actual backend workflows
        run: python -m unittest discover -s skills/tests -p 'test_*.py' -v
