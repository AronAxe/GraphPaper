name: Prepare voice graphs and JEV fix
on:
  push:
    branches: ['fix/jev-voice-graphs-v0.5']
    paths: ['_change/**', '.github/workflows/voice-assembly.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[prepare]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source edits on GitHub
        run: |
          python _change/apply.py
          python _change/finish.py
          python _change/corrections.py
          rm -rf _change
          python -m compileall -q graphpaper scripts tests
          node --check ui/voices.js
      - run: python -m pip install -q -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/voices-unit.xml
      - name: Verify docs and source manifest, then publish reviewable source
        run: |
          python scripts/docs_tool.py check
          git add -A -- graphpaper ui scripts tests docs README.md CHANGELOG.md pyproject.toml _change .github
          python scripts/prepare_assets.py --manifest
          git add publish-manifest.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire reusable voice graphs and automatic bounded JEV decisions'
          git push origin HEAD:fix/jev-voice-graphs-v0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voices-preparation-tests
          path: test-results/
