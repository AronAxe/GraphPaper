<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="0.55" stop-color="#0a1522"/>
      <stop offset="1" stop-color="#050b13"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#cbefff"/>
      <stop offset="1" stop-color="#7fd6ff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#56e4ff"/>
      <stop offset="1" stop-color="#3c9cff"/>
    </linearGradient>
    <radialGradient id="nodeA"><stop offset="0" stop-color="#7ffff1"/><stop offset="1" stop-color="#16c9dc"/></radialGradient>
    <radialGradient id="nodeB"><stop offset="0" stop-color="#85dfff"/><stop offset="1" stop-color="#218cff"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7ec9ff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <!-- ambient graph -->
  <g stroke="#43aef5" stroke-opacity=".22" fill="none" stroke-width="2">
    <path d="M520 94L680 55L820 122L990 70L1130 142L1292 105L1470 180"/>
    <path d="M680 55L730 185L820 122L905 210L1130 142L1210 262L1470 180"/>
    <path d="M905 210L1050 245L1210 262L1380 320"/>
  </g>
  <g fill="#2e95e9" fill-opacity=".45">
    <circle cx="520" cy="94" r="10"/><circle cx="680" cy="55" r="16"/><circle cx="820" cy="122" r="11"/>
    <circle cx="990" cy="70" r="13"/><circle cx="1130" cy="142" r="18"/><circle cx="1292" cy="105" r="12"/>
    <circle cx="1470" cy="180" r="15"/><circle cx="730" cy="185" r="19"/><circle cx="905" cy="210" r="21"/>
    <circle cx="1050" cy="245" r="11"/><circle cx="1210" cy="262" r="15"/><circle cx="1380" cy="320" r="18"/>
  </g>

  <!-- left faint concepts -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="4" fill="#73b8e7" fill-opacity=".42">
    <text x="58" y="75">IDEAS</text>
    <text x="58" y="112">SOURCES</text>
    <text x="58" y="149">KNOWLEDGE</text>
    <text x="58" y="186">CONNECTIONS</text>
    <text x="58" y="223">BETTER WRITING</text>
  </g>

  <!-- logo -->
  <g transform="translate(250 225)" filter="url(#glow)">
    <path d="M0 0h118l62 62v150a26 26 0 0 1-26 26H0a26 26 0 0 1-26-26V26A26 26 0 0 1 0 0z"
          fill="#0b1a29" stroke="url(#paper)" stroke-width="12"/>
    <path d="M118 0v54a12 12 0 0 0 12 12h50" fill="#c9efff" opacity=".95"/>
    <g stroke="#68eaff" stroke-width="5">
      <path d="M32 135L78 78L132 132L84 185Z"/>
    </g>
    <circle cx="32" cy="135" r="22" fill="url(#nodeA)"/>
    <circle cx="78" cy="78" r="17" fill="url(#nodeB)"/>
    <circle cx="132" cy="132" r="17" fill="url(#nodeB)"/>
    <circle cx="84" cy="185" r="18" fill="url(#nodeB)"/>
  </g>

  <!-- title -->
  <text x="505" y="330" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="112" font-weight="700" fill="url(#title)">GraphPaper</text>
  <text x="510" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="400" letter-spacing="2" fill="#aabbd0">Graph-first AI writing studio</text>

  <!-- workflow -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#d6e5f3">
    <text x="510" y="482">Sources</text>
    <text x="628" y="482" fill="#79bce8">→</text>
    <text x="680" y="482">Graph</text>
    <text x="780" y="482" fill="#79bce8">→</text>
    <text x="830" y="482">Angles</text>
    <text x="942" y="482" fill="#79bce8">→</text>
    <text x="995" y="482">Drafts</text>
  </g>

  <!-- right copy -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="4" fill="#74afe0" fill-opacity=".52">
    <text x="1370" y="76">RESEARCH</text>
    <text x="1370" y="110">REASON</text>
    <text x="1370" y="144">EXPLORE</text>
    <text x="1370" y="178">SYNTHESIZE</text>
    <text x="1370" y="212">DRAFT</text>
    <text x="1370" y="246">REPEAT</text>
  </g>
  <text x="1230" y="440" font-family="Georgia,serif" font-size="36" font-style="italic" fill="#dcecff" fill-opacity=".78">Ideas write further.</text>
  <path d="M1234 455h255" stroke="#29d8ff" stroke-width="3" stroke-opacity=".78"/>

  <!-- bottom network -->
  <g stroke="#269fee" stroke-opacity=".28" fill="none">
    <path d="M0 585C200 515 285 605 440 555S710 520 875 570S1175 500 1600 565"/>
    <path d="M0 610C210 550 325 625 470 585S745 555 910 598S1190 540 1600 600"/>
  </g>
</svg>